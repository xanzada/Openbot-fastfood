services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    # Reachable from every container on dokploy-network, so it must not be open.
    # redis-cli picks the password up from REDISCLI_AUTH, which keeps the
    # healthcheck below unchanged and free of shell quoting.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - openbot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # WhatsPro reads the same chatwoot:* keys and subscribes to
    # chatwoot:events:{instanceId}. Without the shared network this service
    # resolves only inside the openbot stack, so the SOS signal never arrives.
    networks:
      - dokploy-network
      - default

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_SOURCE_NAME: openbot
      BACKUP_GIT_URL: ${BACKUP_GIT_URL:-}
      BACKUP_GIT_BRANCH_PREFIX: snapshot-openbot
      BACKUP_SSH_PRIVATE_KEY_B64: ${BACKUP_SSH_PRIVATE_KEY_B64:-}
      BACKUP_AGE_RECIPIENT_B64: ${BACKUP_AGE_RECIPIENT_B64:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-900}
      REDIS_URL: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
    volumes:
      - backup_state:/work
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 4
      start_period: 2m

volumes:
  openbot_redis_data:
  backup_state:

networks:
  dokploy-network:
    external: true
